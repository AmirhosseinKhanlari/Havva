<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Havva</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/console.css?v={{ asset_ver }}">
</head>
<body>
  <div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="wrap" style="display:flex;align-items:center;justify-content:center;min-height:90vh">
    <div class="glass pad" style="width:100%;max-width:360px">
      <div class="brand" style="margin-bottom:16px"><span class="mark">{% include "_eye.svg" %}</span><span>Havva</span></div>
      {% if error %}<p style="color:var(--bad);margin:0 0 10px;font-size:13px">{{ error }}</p>{% endif %}
      {% if configured is not defined or configured %}
      <form method="post" action="/login" class="hlist" style="gap:12px">
        <input name="token" type="password" placeholder="Access token" autofocus class="field">
        <button class="pill primary" style="justify-content:center">Sign in</button>
      </form>
      {% else %}
      <p class="muted" style="font-size:12.5px;margin:0">Access token not configured. Add
        <span class="mono">WEB_AUTH_TOKEN=&lt;secret&gt;</span> to <span class="mono">.env</span> and restart the server.</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
