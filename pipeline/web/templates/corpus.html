{% extends "base.html" %}
{% block title %}Corpus{% endblock %}
{% block h1 %}Corpus{% endblock %}
{% block content %}
<div class="section">
  <form hx-get="/corpus" hx-target="#corpus-results" hx-swap="outerHTML"
        hx-trigger="submit, change from:select, keyup changed delay:400ms from:input[name='q']">
    <div class="searchbar" style="margin-bottom:14px">
      <div style="width:16px;height:16px;border-radius:50%;border:2px solid var(--ink3)"></div>
      <input name="q" value="{{ q }}" placeholder="Search name, bundle id, or app id">
      <span class="muted" style="font-size:12.5px;white-space:nowrap">{{ total }} apps</span>
    </div>
    <div class="chips" style="margin-bottom:18px">
      <select name="category" class="chip" style="appearance:none">
        <option value="">All categories</option>
        {% for c in categories %}<option value="{{ c }}" {% if c==category %}selected{% endif %}>{{ c }}</option>{% endfor %}
      </select>
      <select name="acquired" class="chip"><option value="">Acquired: any</option><option value="1" {% if acquired=='1' %}selected{% endif %}>Acquired</option><option value="0" {% if acquired=='0' %}selected{% endif %}>Not acquired</option></select>
      <select name="pinned" class="chip"><option value="">Pinning: any</option><option value="1" {% if pinned=='1' %}selected{% endif %}>Pinned</option><option value="0" {% if pinned=='0' %}selected{% endif %}>Not pinned</option></select>
      <select name="attest" class="chip"><option value="">Attest: any</option><option value="1" {% if attest=='1' %}selected{% endif %}>Adopts</option><option value="0" {% if attest=='0' %}selected{% endif %}>None</option></select>
    </div>
  </form>
  {% include "_corpus_table.html" %}
</div>
{% endblock %}
