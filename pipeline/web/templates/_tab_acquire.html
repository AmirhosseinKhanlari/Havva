<div class="hlist">
  {% if acq and acq['decrypt_status']==1 %}
    <div class="banner"><div class="row1"><span class="bdot" style="background:var(--ok)"></span>
      <span class="btitle">Decrypted</span></div>
      <div class="ink2 mono" style="margin-top:8px;padding-left:22px;font-size:13px">{{ acq['ipa_path'] }}</div>
      <div style="margin-top:10px;padding-left:22px"><a class="pill small primary" href="/app/{{ app_id }}/download">Download IPA</a></div>
    </div>
  {% elif acq and acq['error'] %}
    <div class="banner hit"><div class="row1"><span class="bdot" style="background:var(--bad)"></span><span class="btitle">Last attempt failed</span></div>
      <div class="ink2" style="margin-top:8px;padding-left:22px;font-size:13px">{{ acq['error'][:200] }}</div></div>
  {% else %}
    <p class="muted" style="font-size:14px">Not acquired yet.</p>
  {% endif %}

  <form hx-post="/app/{{ app_id }}/acquire" hx-target="#acq-action" hx-swap="innerHTML" style="display:flex;gap:10px;align-items:center">
    <input name="version" placeholder="version (optional, e.g. 1.0.5)" class="field" style="flex:1">
    <button class="pill primary">Download + decrypt</button>
  </form>
  <button class="pill small" hx-get="/app/{{ app_id }}/versions" hx-target="#versions" hx-swap="innerHTML" style="align-self:flex-start">List older versions</button>
  <div id="versions"></div>
  <div id="acq-action"></div>
</div>
