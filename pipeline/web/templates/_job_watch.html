<div id="jobwrap-{{ job['id'] }}">
  {% include "_job_status.html" %}
  <div class="logbox" id="log-{{ job['id'] }}"></div>
  <script>(function(){
    var box = document.getElementById('log-{{ job['id'] }}');
    if(!box || box.dataset.init) return;
    box.dataset.init = '1';
    function cls(t){
      var l = t.toLowerCase();
      if(/error|fail|✗|invalid|crash|missing|not found|unavailable/.test(l)) return 'log-err';
      if(/✓|\[ok\]|injected|installed|signed|captured|verified|decrypted|\bhost\b|success|done/.test(l)) return 'log-ok';
      if(t.charAt(0) === '=' || t.charAt(0) === '[') return 'log-head';
      if(/^\s/.test(t) || t.charAt(0) === '·' || t.charAt(0) === '-') return 'log-step';
      return '';
    }
    function add(line){
      var s = line.replace(/\s+$/,'');
      if(!s) return;
      var d = document.createElement('div');
      d.className = 'logline ' + cls(s);
      d.textContent = s;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }
    var es = new EventSource('/jobs/{{ job['id'] }}/stream');
    es.onmessage = function(e){ add(e.data); };
    es.addEventListener('done', function(){ box.classList.add('done'); es.close(); });
    es.onerror = function(){ /* server closes on completion; ignore */ };
  })();</script>
</div>
