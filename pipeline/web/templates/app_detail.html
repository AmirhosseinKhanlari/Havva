{% extends "base.html" %}
{% block title %}{{ app['name'] or app_id }}{% endblock %}
{% block content %}
<a href="/corpus" class="text-indigo-400 text-sm">&larr; Corpus</a>
<h1 class="text-lg font-semibold mt-1 mb-1">{{ app['name'] or app_id }}</h1>
<p class="text-xs text-slate-500 font-mono mb-3">{{ app['bundle_id'] or '' }} · {{ app_id }}</p>

<div class="flex gap-1 overflow-x-auto mb-3 text-sm border-b border-slate-800">
  {% for t in tabs %}
  <button class="px-3 py-2 whitespace-nowrap {% if t==tab %}border-b-2 border-indigo-500{% else %}text-slate-400{% endif %}"
          hx-get="/app/{{ app_id }}/tab/{{ t }}" hx-target="#tab-content" hx-swap="innerHTML"
          onclick="document.querySelectorAll('[data-tabbtn]').forEach(e=>e.classList.remove('border-b-2','border-indigo-500'));this.classList.add('border-b-2','border-indigo-500')"
          data-tabbtn>{{ t }}</button>
  {% endfor %}
</div>

<div id="tab-content">
  {% include "_tab_overview.html" %}
</div>
{% endblock %}
