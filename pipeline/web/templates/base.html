<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Havva{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/console.css?v={{ asset_ver }}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
  <script>
    (function(){try{var t=localStorage.getItem('havva-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    function markTheme(t){var els=document.querySelectorAll('#theme-seg .seg');
      for(var i=0;i<els.length;i++){els[i].classList.toggle('on', els[i].getAttribute('data-theme-val')===t);}}
    function setTheme(t){try{localStorage.setItem('havva-theme',t);}catch(e){}
      if(t==='auto')document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme',t);
      markTheme(t);}
    document.addEventListener('DOMContentLoaded',function(){var t='auto';
      try{t=localStorage.getItem('havva-theme')||'auto';}catch(e){} markTheme(t);});
    // Ask for notification permission on the first click (a user gesture), so
    // job-completion notifications can fire.
    document.addEventListener('click', function once(){
      try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
      document.removeEventListener('click', once);
    });
  </script>
</head>
<body>
  <div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="wrap">
    <div class="page-head">
      <div>
        <div class="brand"><span class="mark">{% include "_eye.svg" %}</span><span>Havva</span></div>
        <h1 class="title">{% block h1 %}Console{% endblock %}</h1>
        {% block subtitle %}{% endblock %}
      </div>
      <div class="segmented" id="theme-seg">
        <button class="seg" data-theme-val="auto" onclick="setTheme('auto')">Auto</button>
        <button class="seg" data-theme-val="light" onclick="setTheme('light')">Light</button>
        <button class="seg" data-theme-val="dark" onclick="setTheme('dark')">Dark</button>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
  {% block nav %}{% include "_nav.html" %}{% endblock %}

  <!-- Custom confirm modal: replaces the native browser confirm for every hx-confirm -->
  <div class="cmodal-overlay" id="cmodal" aria-hidden="true">
    <div class="glass cmodal" role="dialog" aria-modal="true" aria-labelledby="cmodal-title">
      <div class="cmodal-title" id="cmodal-title">Confirm</div>
      <div class="cmodal-msg" id="cmodal-msg"></div>
      <div class="cmodal-actions">
        <button type="button" class="pill" id="cmodal-cancel">Cancel</button>
        <button type="button" class="pill primary" id="cmodal-ok">Continue</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      var overlay=document.getElementById('cmodal'),
          msg=document.getElementById('cmodal-msg'),
          ok=document.getElementById('cmodal-ok'),
          cancel=document.getElementById('cmodal-cancel'),
          pending=null;
      function close(){overlay.classList.remove('show');overlay.setAttribute('aria-hidden','true');pending=null;}
      function open(text,cb){msg.textContent=text;pending=cb;overlay.classList.add('show');
        overlay.setAttribute('aria-hidden','false');setTimeout(function(){ok.focus();},30);}
      ok.addEventListener('click',function(){var p=pending;close();if(p)p();});
      cancel.addEventListener('click',close);
      overlay.addEventListener('click',function(e){if(e.target===overlay)close();});
      document.addEventListener('keydown',function(e){
        if(!overlay.classList.contains('show'))return;
        if(e.key==='Escape')close();
        else if(e.key==='Enter'){var p=pending;close();if(p)p();}});
      // Intercept htmx's confirmation so it uses our modal instead of window.confirm.
      document.body.addEventListener('htmx:confirm',function(e){
        if(!e.detail.question)return;      // no hx-confirm on this element -> proceed
        e.preventDefault();
        open(e.detail.question,function(){e.detail.issueRequest(true);});
      });
    })();
  </script>
</body>
</html>
