<div class="chips">
  {% for t, ok in tools.items() %}<span class="badge mono" style="{% if ok %}color:var(--ok){% else %}color:var(--bad){% endif %}">{{ t }}</span>{% endfor %}
  {% for a, ok in assets.items() %}<span class="badge mono" style="{% if ok %}color:var(--ok){% else %}color:var(--bad){% endif %}">{{ a }}</span>{% endfor %}
</div>
