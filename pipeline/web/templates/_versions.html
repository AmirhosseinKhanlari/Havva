{% if error %}<p style="color:var(--bad);font-size:12px">{{ error }}</p>{% endif %}
{% if versions %}
<div class="glass sm" style="padding:8px 4px;margin-top:8px">
  {% for v in versions %}
  <div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--hair)">
    <span style="font-size:13px;font-weight:600">{{ v['shortVersion'] }}</span>
    <span class="mono muted" style="font-size:12px">{{ v['verId'] }}</span>
    <button class="pill small" style="margin-left:auto" hx-post="/app/{{ app_id }}/acquire"
            hx-vals='{"version": "{{ v['verId'] }}"}' hx-target="#acq-action" hx-swap="innerHTML">get</button>
  </div>
  {% endfor %}
</div>
{% endif %}
