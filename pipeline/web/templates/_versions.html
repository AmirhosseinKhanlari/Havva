{% if error %}
<div class="banner hit" style="padding:12px 14px"><div class="row1"><span class="bdot" style="background:var(--bad)"></span><span style="font-size:13px;font-weight:600">{{ error }}</span></div></div>
{% elif versions %}
<div class="glass sm" style="margin-top:8px;overflow:hidden">
  {% for v in versions %}
  <div class="vrow">
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600">{{ v['shortVersion'] }}</div>
      <div class="mono muted" style="font-size:11.5px">build {{ v['verId'] }}</div>
    </div>
    <button class="get-btn" hx-post="/app/{{ app_id }}/acquire"
            hx-vals='{"version": "{{ v['verId'] }}"}'
            hx-target="#acq-action" hx-swap="innerHTML">Get</button>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="muted" style="font-size:13px;margin-top:8px">No older versions available.</p>
{% endif %}
